<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<meta name="description" content="Something new is on the horizon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #241b4d;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  h1 {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    color: #fff6d8;
    font-size: clamp(18px, 4.5vw, 44px);
    letter-spacing: 0.12em;
    text-align: center;
    margin: 0;
    text-shadow: 3px 3px 0 rgba(20, 8, 40, 0.85);
  }
  h1 .cursor {
    display: inline-block;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  /* subtle CRT scanlines */
  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 3px,
      rgba(0, 0, 0, 0.12) 3px,
      rgba(0, 0, 0, 0.12) 4px
    );
  }
  @media (prefers-reduced-motion: reduce) {
    h1 .cursor { animation: none; }
  }
  .atlas-links {
    margin-top: 42px;
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }
  .atlas-links a {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: clamp(9px, 1.4vw, 12px);
    color: #ffd07a;
    text-decoration: none;
    padding: 12px 16px;
    border: 3px solid #ffd07a;
    background: rgba(20, 8, 40, 0.55);
    text-shadow: 2px 2px 0 rgba(20, 8, 40, 0.85);
  }
  .atlas-links a:hover {
    color: #140828;
    background: #ffd07a;
    text-shadow: none;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="scanlines"></div>
<div class="overlay">
  <h1>COMING SOON<span class="cursor">_</span></h1>
  <nav class="atlas-links" aria-label="Projects">
    <a href="/carbon-atlas/">&#9654; CARBON ATLAS</a>
    <a href="/nature-atlas/">&#9654; NATURE ATLAS</a>
  </nav>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('scene');
  var ctx = canvas.getContext('2d');
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LOGICAL_H = 108;
  var W = 192, H = LOGICAL_H;
  var horizonY = 78;

  // deterministic PRNG so the scene is identical every visit
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 4x4 Bayer matrix for ordered dithering
  var BAYER = [
    [ 0,  8,  2, 10],
    [12,  4, 14,  6],
    [ 3, 11,  1,  9],
    [15,  7, 13,  5]
  ];

  function hex(c) {
    return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  }
  function lerpC(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }
  function css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

  // sky gradients, top -> horizon
  var SUNSET = ['#241b4d', '#5b2a86', '#b63b7f', '#e8615a', '#ffa14a', '#ffd07a'].map(hex);
  var NIGHT  = ['#050514', '#0a0a24', '#12123a', '#1a1a4a', '#24204f', '#2e2a55'].map(hex);

  var SUN_HI = hex('#ffe27a'), SUN_LO = hex('#ff5533');
  var FAR_HI = hex('#3b2a5e'), FAR_LO = hex('#0e0e26');
  var NEAR_HI = hex('#1d1440'), NEAR_LO = hex('#060612');

  var farRidge = [], nearRidge = [], stars = [];

  function genRidge(seed, base, minPeak, jag) {
    var rnd = mulberry32(seed);
    var ridge = new Array(W);
    var h = base - 8 - rnd() * 10;
    for (var x = 0; x < W; x++) {
      h += (rnd() - 0.5) * jag;
      if (rnd() < 0.06) h -= rnd() * 7;      // occasional sharp peak
      if (h < minPeak) h = minPeak + rnd() * 3;
      if (h > base - 2) h = base - 2 - rnd() * 3;
      ridge[x] = Math.round(h);
    }
    return ridge;
  }

  function genStars() {
    var rnd = mulberry32(20260824);
    var s = [];
    for (var i = 0; i < 70; i++) {
      s.push({
        x: Math.floor(rnd() * W),
        y: Math.floor(rnd() * 62),
        phase: rnd(),
        speed: 0.4 + rnd() * 0.8
      });
    }
    return s;
  }

  function rebuild() {
    var aspect = window.innerWidth / window.innerHeight;
    if (!isFinite(aspect) || aspect <= 0) aspect = 16 / 9;
    W = Math.max(96, Math.min(320, Math.round(LOGICAL_H * aspect)));
    canvas.width = W;
    canvas.height = H;
    farRidge = genRidge(1337, horizonY, 46, 2.6);
    nearRidge = genRidge(9001, H, 68, 3.4);
    stars = genStars();
  }

  function smoothstep(t) { return t * t * (3 - 2 * t); }

  // d: 0 = golden sunset, 1 = starry night
  function draw(d, t) {
    var n = SUNSET.length;
    var pal = [];
    for (var i = 0; i < n; i++) pal.push(lerpC(SUNSET[i], NIGHT[i], d));

    // sky with ordered dithering between bands
    for (var y = 0; y < horizonY; y++) {
      var v = (y / (horizonY - 1)) * (n - 1);
      var i0 = Math.floor(v);
      var f = v - i0;
      for (var x = 0; x < W; x++) {
        var th = (BAYER[y & 3][x & 3] + 0.5) / 16;
        var idx = f > th ? Math.min(i0 + 1, n - 1) : i0;
        ctx.fillStyle = css(pal[idx]);
        ctx.fillRect(x, y, 1, 1);
      }
    }
    // below-horizon fill (behind near ridge)
    ctx.fillStyle = css(lerpC(FAR_LO, NIGHT[0], d * 0.5));
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // stars fade in as night falls
    if (d > 0.45) {
      var starA = Math.min(1, (d - 0.45) / 0.4);
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var tw = Math.sin((t * st.speed + st.phase) * Math.PI * 2);
        if (tw > -0.2 && st.y < farRidge[st.x]) {
          ctx.fillStyle = tw > 0.6 ? 'rgba(240,244,255,' + starA + ')'
                                   : 'rgba(160,170,220,' + (starA * 0.8) + ')';
          ctx.fillRect(st.x, st.y, 1, 1);
        }
      }
    }

    // sun: sinks behind the mountains as d -> 1
    var sunR = 13;
    var sunX = Math.round(W * 0.5);
    var sunY = Math.round(34 + d * (horizonY + sunR + 4 - 34));
    var sunC = lerpC(SUN_HI, SUN_LO, Math.min(1, d * 1.6));
    var rimC = lerpC(sunC, pal[n - 1], 0.45);
    for (var dy = -sunR - 2; dy <= sunR + 2; dy++) {
      var py = sunY + dy;
      if (py < 0 || py >= horizonY) continue;
      // classic horizontal slice cutouts on the lower half
      if (dy > 2 && ((py % 4) === 0)) continue;
      for (var dx = -sunR - 2; dx <= sunR + 2; dx++) {
        var px = sunX + dx;
        if (px < 0 || px >= W) continue;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= sunR) {
          ctx.fillStyle = css(sunC);
          ctx.fillRect(px, py, 1, 1);
        } else if (dist <= sunR + 2 && ((px + py) & 1) === 0) {
          ctx.fillStyle = css(rimC);   // dithered glow rim
          ctx.fillRect(px, py, 1, 1);
        }
      }
    }

    // mountains
    var farC = css(lerpC(FAR_HI, FAR_LO, d));
    for (var fx = 0; fx < W; fx++) {
      ctx.fillStyle = farC;
      ctx.fillRect(fx, farRidge[fx], 1, horizonY - farRidge[fx] + 6);
    }
    var nearC = css(lerpC(NEAR_HI, NEAR_LO, d));
    for (var nx = 0; nx < W; nx++) {
      ctx.fillStyle = nearC;
      ctx.fillRect(nx, nearRidge[nx], 1, H - nearRidge[nx]);
    }
  }

  var CYCLE = 48;      // seconds for one sunset->night->sunset loop
  var FPS = 12;        // chunky retro frame rate
  var last = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 1000 / FPS) return;
    last = now;
    var t = now / 1000;
    var u = (t % CYCLE) / CYCLE;
    var d = u < 0.5 ? smoothstep(u * 2) : smoothstep(2 - u * 2);
    // linger near full night briefly
    draw(d, t);
  }

  window.addEventListener('resize', function () {
    rebuild();
    if (reducedMotion) draw(0.3, 0);
  });

  rebuild();
  draw(0.3, 0);      // paint immediately so there is no black flash
  if (!reducedMotion) {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
