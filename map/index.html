<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map — Conscious Cash</title>
<meta name="description" content="The Conscious Cash overworld: every page of the site as a place on one 8-bit map. Click a region to travel.">
<meta property="og:title" content="World Map — Conscious Cash">
<meta property="og:description" content="The Conscious Cash overworld: every page of the site as a place on one 8-bit map. Click a region to travel.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #140e2b; }
  #world {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .back {
    position: fixed; top: 16px; left: 18px; z-index: 10;
    font-family: "Press Start 2P", monospace; font-size: 10px; text-decoration: none;
    color: #ffd07a; text-shadow: 2px 2px 0 rgba(20,8,40,.85); padding: 8px;
  }
  .back:hover { color: #fff6d8; }
  .title {
    position: fixed; top: 18px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: "Press Start 2P", monospace; font-size: clamp(11px, 2vw, 16px);
    color: #fff6d8; text-shadow: 2px 2px 0 rgba(20,8,40,.85); letter-spacing: .08em;
  }
  .hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: "Press Start 2P", monospace; font-size: 9px; color: #b9aed6;
    text-shadow: 2px 2px 0 rgba(20,8,40,.85);
  }
  .spot {
    position: fixed; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-decoration: none; z-index: 5;
  }
  .spot .lbl {
    font-family: "Press Start 2P", monospace; font-size: clamp(8px, 1.3vw, 11px);
    color: #fff6d8; text-shadow: 2px 2px 0 rgba(20,8,40,.9);
    background: rgba(20, 8, 40, 0.55); border: 2px solid rgba(255,208,122,.55);
    padding: 7px 10px; white-space: nowrap;
    opacity: .85; transition: opacity .12s, border-color .12s;
  }
  .spot .pin {
    font-family: "Press Start 2P", monospace; font-size: 11px; color: #ffd07a;
    text-shadow: 2px 2px 0 rgba(20,8,40,.9);
    animation: bob 1.4s steps(2) infinite;
  }
  .spot:hover .lbl, .spot:focus-visible .lbl { opacity: 1; border-color: #ffd07a; color: #ffd07a; }
  @keyframes bob { 50% { transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .spot .pin { animation: none; } }
</style>
</head>
<body>
<canvas id="world"></canvas>
<a class="back" href="/">&#9664; BACK</a>
<div class="title">WORLD MAP</div>

<a class="spot" href="/" style="left:12%; top:56%"><span class="pin">▼</span><span class="lbl">HOME</span></a>
<a class="spot" href="/carbon-atlas/" style="left:32%; top:60%"><span class="pin">▼</span><span class="lbl">CARBON ATLAS</span></a>
<a class="spot" href="/nature-atlas/" style="left:52%; top:63%"><span class="pin">▼</span><span class="lbl">NATURE ATLAS</span></a>
<a class="spot" href="/solutions/" style="left:74%; top:58%"><span class="pin">▼</span><span class="lbl">SOLUTIONS</span></a>
<a class="spot" href="/about/" style="left:42%; top:82%"><span class="pin">▼</span><span class="lbl">ABOUT</span></a>

<div class="hint">CLICK A PLACE TO TRAVEL</div>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("world");
  var ctx = canvas.getContext("2d");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var H = 108, W = 192;
  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
  function lerpC(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
  function css(c){return "rgb("+c[0]+","+c[1]+","+c[2]+")";}
  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}
  // sky keyframes across x: sunset (west) → night (centre) → dawn (east)
  var K = [
    ["#241b4d","#5b2a86","#b63b7f","#e8615a","#ffa14a"].map(hex),
    ["#050514","#0a0a24","#12123a","#1a1a4a","#24204f"].map(hex),
    ["#241b4d","#4a2a7e","#8a3a86","#d85a72","#ffd07a"].map(hex)
  ];
  var far = [], near = [], stars = [], pines = [], turbines = [];
  function genRidge(seed, base, minPeak, jag) {
    var rnd = mulberry32(seed);
    var r = new Array(W);
    var h = base - 10 - rnd() * 8;
    for (var x = 0; x < W; x++) {
      h += (rnd() - 0.5) * jag;
      if (rnd() < 0.05) h -= rnd() * 6;
      if (h < minPeak) h = minPeak + rnd() * 3;
      if (h > base - 3) h = base - 3 - rnd() * 3;
      r[x] = Math.round(h);
    }
    return r;
  }
  function rebuild() {
    var aspect = window.innerWidth / Math.max(1, window.innerHeight);
    if (!isFinite(aspect) || aspect <= 0) aspect = 16 / 9;
    W = Math.max(128, Math.min(320, Math.round(H * aspect)));
    canvas.width = W; canvas.height = H;
    far = genRidge(1337, 66, 34, 2.4);
    near = genRidge(9001, H, 74, 3.2);
    stars = [];
    var rs = mulberry32(20260824);
    for (var i = 0; i < 60; i++) {
      stars.push({ x: Math.floor(rs() * W), y: Math.floor(rs() * 40), ph: rs(), sp: 0.4 + rs() * 0.8 });
    }
    pines = [];
    var rp = mulberry32(444);
    for (var px = Math.round(W * 0.44); px < W * 0.62; px += 3 + Math.floor(rp() * 5)) {
      pines.push({ x: px, h: 4 + Math.floor(rp() * 4) });
    }
    turbines = [];
    var rt = mulberry32(88);
    for (var t = 0; t < 3; t++) {
      turbines.push({ x: Math.round(W * (0.7 + 0.08 * t) + rt() * 4), h: 10 + Math.floor(rt() * 3), ph: rt() * 6 });
    }
  }
  function skyAt(fx, fy) {
    var seg = fx < 0.5 ? 0 : 1;
    var t = fx < 0.5 ? fx * 2 : (fx - 0.5) * 2;
    var a = K[seg], b = K[seg + 1];
    var vi = fy * (a.length - 1);
    var i0 = Math.floor(vi), f = vi - i0;
    var i1 = Math.min(i0 + 1, a.length - 1);
    return { c0: lerpC(a[i0], b[i0], t), c1: lerpC(a[i1], b[i1], t), f: f };
  }
  function draw(time) {
    var horizon = 66;
    for (var y = 0; y < horizon; y++) {
      for (var x = 0; x < W; x++) {
        var s = skyAt(x / W, y / (horizon - 1));
        var th = (BAYER[y & 3][x & 3] + 0.5) / 16;
        ctx.fillStyle = css(s.f > th ? s.c1 : s.c0);
        ctx.fillRect(x, y, 1, 1);
      }
    }
    // stars, brightest in the middle of the map
    stars.forEach(function (st) {
      var mid = 1 - Math.abs(st.x / W - 0.5) * 2.4;
      if (mid <= 0.1) return;
      var tw = reduced ? 1 : Math.sin((time / 1000 * st.sp + st.ph) * Math.PI * 2);
      if (tw > -0.2 && st.y < far[st.x]) {
        ctx.fillStyle = tw > 0.6 ? "rgba(240,244,255," + (0.95 * mid) + ")" : "rgba(170,180,230," + (0.6 * mid) + ")";
        ctx.fillRect(st.x, st.y, 1, 1);
      }
    });
    // west: setting striped sun over HOME mountains
    var sx = Math.round(W * 0.12), sy = 34, sr = 8;
    ctx.fillStyle = "#ffcf6a";
    for (var dy = -sr; dy <= sr; dy++) {
      var py = sy + dy;
      if (dy > 1 && py % 3 === 0) continue;
      var hw = Math.floor(Math.sqrt(sr * sr - dy * dy));
      ctx.fillRect(sx - hw, py, hw * 2 + 1, 1);
    }
    // east: rising sun over SOLUTIONS
    var rx2 = Math.round(W * 0.88);
    ctx.fillStyle = "#ffe27a";
    for (var dy3 = -7; dy3 <= 0; dy3++) {
      var py3 = horizon - 22 + dy3;
      if (dy3 > -5 && py3 % 3 === 0) continue;
      var hw3 = Math.floor(Math.sqrt(49 - dy3 * dy3));
      ctx.fillRect(rx2 - hw3, py3, hw3 * 2 + 1, 1);
    }
    // far ridge
    for (var fx = 0; fx < W; fx++) {
      ctx.fillStyle = fx < W * 0.25 ? "#2c1f52" : "#1b1440";
      ctx.fillRect(fx, far[fx], 1, horizon - far[fx] + 8);
    }
    // scorecard observatory on the eastern peak
    var ox = Math.round(W * 0.88);
    var oy = far[ox];
    ctx.fillStyle = "#efe8f8";
    ctx.fillRect(ox - 2, oy - 4, 5, 4);
    ctx.fillRect(ox - 1, oy - 6, 3, 2);
    ctx.fillStyle = "#3d8ee6";
    ctx.fillRect(ox, oy - 5, 1, 1);
    // ground band
    ctx.fillStyle = "#191233";
    ctx.fillRect(0, horizon, W, H - horizon);
    // CARBON: city cluster
    var cx0 = Math.round(W * 0.28);
    var rc = mulberry32(303);
    for (var b2 = 0; b2 < 8; b2++) {
      var bx = cx0 + b2 * 4 - 14;
      var bh = 6 + Math.floor(rc() * 9);
      ctx.fillStyle = "#0d081f";
      ctx.fillRect(bx, horizon - bh, 3, bh + 4);
      if (rc() > 0.4) {
        ctx.fillStyle = "#ffd07a";
        ctx.fillRect(bx + 1, horizon - bh + 2 + Math.floor(rc() * 3), 1, 1);
      }
    }
    ctx.fillStyle = "#0d081f";
    ctx.fillRect(cx0 + 16, horizon - 15, 2, 19);
    ctx.fillStyle = "rgba(210,200,230,.4)";
    var sm = reduced ? 0.3 : (time / 4000) % 1;
    ctx.fillRect(cx0 + 17 + Math.round(Math.sin(sm * 6) * 2), horizon - 17 - Math.round(sm * 6), 2, 1);
    // NATURE: pine forest + lake
    pines.forEach(function (p) {
      ctx.fillStyle = "#0d1f14";
      var base = horizon + 2;
      for (var l = 0; l < p.h; l++) {
        var w = Math.max(1, Math.round((p.h - l) * 0.8));
        ctx.fillRect(p.x - Math.floor(w / 2), base - l - 2, w, 1);
      }
    });
    ctx.fillStyle = "#141c3f";
    ctx.fillRect(Math.round(W * 0.47), horizon + 6, Math.round(W * 0.1), 4);
    // SOLUTIONS: turbines + solar strip
    turbines.forEach(function (t) {
      var hubY = horizon + 2 - t.h;
      ctx.fillStyle = "#efe8f8";
      ctx.fillRect(t.x, hubY, 1, t.h);
      var ang = reduced ? t.ph : time / 1400 + t.ph;
      for (var b3 = 0; b3 < 3; b3++) {
        var a3 = ang + b3 * (Math.PI * 2 / 3);
        for (var s3 = 1; s3 <= 4; s3++) {
          ctx.fillRect(Math.round(t.x + Math.cos(a3) * s3), Math.round(hubY + Math.sin(a3) * s3), 1, 1);
        }
      }
    });
    for (var sp = 0; sp < 5; sp++) {
      ctx.fillStyle = "#2a4a8e";
      ctx.fillRect(Math.round(W * 0.68) + sp * 5, horizon + 8, 4, 2);
      ctx.fillStyle = "#4a6ab8";
      ctx.fillRect(Math.round(W * 0.68) + sp * 5, horizon + 8, 4, 1);
    }
    // near ridge (foreground silhouette)
    ctx.fillStyle = "#0a0619";
    for (var nx = 0; nx < W; nx++) {
      ctx.fillRect(nx, near[nx], 1, H - near[nx]);
    }
    // ABOUT: campfire on the foreground ridge
    var fx2 = Math.round(W * 0.42);
    var fy2 = near[fx2];
    var flick = reduced ? 0 : Math.floor(time / 250) % 2;
    ctx.fillStyle = "#ff8a4a";
    ctx.fillRect(fx2 - 1, fy2 - 2 - flick, 3, 2 + flick);
    ctx.fillStyle = "#ffd07a";
    ctx.fillRect(fx2, fy2 - 3 - flick, 1, 2);
    // tiny tent
    ctx.fillStyle = "#2c1f52";
    for (var tl = 0; tl < 4; tl++) {
      ctx.fillRect(fx2 + 5 + tl, fy2 - tl, 8 - tl * 2, 1);
    }
  }
  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 1000 / 10) return;
    last = now;
    draw(now);
  }
  window.addEventListener("resize", function () { rebuild(); draw(0); });
  rebuild();
  draw(0);
  if (!reduced) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
